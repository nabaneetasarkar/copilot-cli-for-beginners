[project]
name = "book-app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pytest>=9.0,<10", "pytest-cov>=7.0,<8"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"bench_find.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
