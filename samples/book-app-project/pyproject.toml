[project]
name = "book-app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.0,<1",
    "bandit>=1.9.0,<2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"bench_find.py" = ["E402"]
"tests/*" = ["E402", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
